<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Gradientes de fondo institucionales -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001e38" />
      <stop offset="45%" stop-color="#003764" />
      <stop offset="85%" stop-color="#00284a" />
      <stop offset="100%" stop-color="#001830" />
    </linearGradient>

    <linearGradient id="luz-hospital" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#005b9f" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#003764" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00284a" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente dorado Hospital Universitario -->
    <linearGradient id="dorado-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf9f" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#c7a36e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ab8850" stop-opacity="0.05" />
    </linearGradient>

    <!-- Gradiente radial de luz central/superior -->
    <radialGradient id="halo-dorado" cx="75%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#c7a36e" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#c7a36e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#003764" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo-azul" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#005b9f" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#003764" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#001e38" stop-opacity="0" />
    </radialGradient>

    <!-- Patrón arquitectónico sutil de ventanal hospitalario -->
    <linearGradient id="arquitectura-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <!-- 1. Fondo base azul profundo -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- 2. Halos de ambiente: calidez dorada y luminosidad azul -->
  <rect width="1920" height="1080" fill="url(#halo-dorado)" />
  <rect width="1920" height="1080" fill="url(#halo-azul)" />

  <!-- 3. Formas arquitectónicas abstractas (volúmenes de hospital / pasillos luminosos) -->
  <g opacity="0.85">
    <!-- Diagonal de perspectiva arquitectónica izquierda -->
    <polygon points="0,0 720,0 480,1080 0,1080" fill="url(#luz-hospital)" />
    <!-- Trazos sutiles de estructura moderna / fachadas -->
    <polygon points="300,0 520,0 840,1080 620,1080" fill="url(#arquitectura-grad)" />
    <polygon points="760,0 880,0 1240,1080 1120,1080" fill="url(#arquitectura-grad)" />
    <polygon points="1200,0 1560,0 1920,800 1920,400" fill="url(#luz-hospital)" opacity="0.6" />
  </g>

  <!-- 4. Cruz médica abstracta y sutil (icono de salud integrado a la arquitectura) -->
  <g transform="translate(1420, 260)" opacity="0.12">
    <!-- Barra vertical -->
    <rect x="-35" y="-140" width="70" height="280" rx="20" fill="#ffffff" />
    <!-- Barra horizontal -->
    <rect x="-140" y="-35" width="280" height="70" rx="20" fill="#ffffff" />
    <!-- Círculo concéntrico de protección médica -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#c7a36e" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
  </g>

  <!-- Segunda cruz médica de escala menor, más profunda a la izquierda -->
  <g transform="translate(320, 720)" opacity="0.08">
    <rect x="-20" y="-80" width="40" height="160" rx="12" fill="#c7a36e" />
    <rect x="-80" y="-20" width="160" height="40" rx="12" fill="#c7a36e" />
  </g>

  <!-- 5. Círculos de luz bokeh y bienestar (tonos dorados y azules clínicos) -->
  <circle cx="1520" cy="380" r="140" fill="url(#dorado-grad)" filter="none" />
  <circle cx="1320" cy="180" r="80" fill="url(#dorado-grad)" />
  <circle cx="1680" cy="620" r="110" fill="url(#luz-hospital)" />
  <circle cx="280" cy="340" r="95" fill="url(#luz-hospital)" opacity="0.4" />
  <circle cx="440" cy="220" r="50" fill="url(#dorado-grad)" opacity="0.7" />
  <circle cx="1080" cy="880" r="130" fill="url(#dorado-grad)" opacity="0.3" />

  <!-- 6. Líneas suaves y ondas que representan cuidado, tecnología y vida -->
  <path d="M-100,880 C400,820 800,940 1200,870 C1600,800 1850,920 2020,860" fill="none" stroke="#005b9f" stroke-width="2" opacity="0.25" />
  <path d="M-50,920 C450,860 750,980 1250,900 C1650,830 1800,950 2050,900" fill="none" stroke="#c7a36e" stroke-width="1.5" opacity="0.2" />
  <path d="M-20,950 C380,900 860,1020 1320,930 C1700,860 1900,980 2100,920" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" />
</svg>
