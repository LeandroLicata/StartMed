# Blueprint de Render. Importalo desde el dashboard (New > Blueprint) apuntando
# a este repo. Las variables marcadas "sync: false" no tienen valor acá: Render
# las deja vacías y las cargás a mano en el dashboard (son secretos o dependen
# del entorno externo — la base de datos MySQL vive fuera de Render).
#
# "sync: false" no funciona dentro de un envVarGroup (Render la ignora), así
# que el grupo compartido abajo solo tiene valores fijos, no secretos. Los
# secretos van repetidos en cada servicio que los necesita.

envVarGroups:
  - name: startmed-shared
    envVars:
      - key: APP_NAME
        value: StartMed
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr # storage/logs/laravel.log queda dentro del contenedor y no lo ves en los logs de Render
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: CLOUDINARY_MINUTOS_URL
        value: "10"
      - key: MAIL_MAILER
        value: log

services:
  - type: web
    name: startmed
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Sin dockerCommand a propósito: el CMD ["web"] del Dockerfile ya hace
    # exactamente esto, y fijarlo acá agregaba una capa entre Render y el
    # ENTRYPOINT que sospechamos causaba el "Exited with status 128" sin logs.
    plan: free
    healthCheckPath: /login
    # preDeployCommand no está disponible en el plan free; migrate/seed corren
    # en el arranque del contenedor (ver docker/entrypoint.sh). Si en algún
    # momento se pasa a un plan pago, se puede volver a mover acá.
    envVars:
      - fromGroup: startmed-shared
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false # https://<tu-servicio>.onrender.com, o el dominio propio
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false # el puerto lo asigna el proveedor externo, no es 3306 (p.ej. Aiven usa uno propio de 5 dígitos)
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false # ruta al CA cert si el proveedor de MySQL exige TLS (p.ej. Aiven); ver guía
      - key: CLOUDINARY_URL
        sync: false

# El cron (schedule:run cada minuto, para el chequeo horario de reprogramaciones
# y la limpieza semanal de huérfanos en Cloudinary) queda afuera a propósito:
# Render no tiene tier free para cron jobs (mínimo $1 USD/mes). Se agrega acá
# cuando el web pase a un plan pago. Mientras tanto esas dos tareas de
# mantenimiento simplemente no corren — no son críticas para probar el sistema.
