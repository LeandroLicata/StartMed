; Limites de subida a la medida de GestorDocumental::REGLAS_ARCHIVO (20 MB).
; La imagen php-fpm-alpine no trae php.ini, asi que sin esto rigen los valores
; por defecto de PHP (2M por archivo, 8M por POST) y cualquier PDF o foto de
; celular de mas de 2 MB se rechazaba antes de llegar a la validacion.
; post_max_size deja margen para el resto del formulario; nginx corta en 25M
; (client_max_body_size en nginx.conf.template).
upload_max_filesize = 20M
post_max_size = 25M
